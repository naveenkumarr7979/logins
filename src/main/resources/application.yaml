server:
  port: 2001

spring:
  application:
    name: logins

  datasource:
    url: jdbc:postgresql://localhost:5432/login-db
    username: postgres
    password: ${DB_PASSWORD:jyoti}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  file:
    name: C:/applications/logins/logs/logins.log

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

  level:
    root: INFO
server:
  port: 2001
spring:
  application:
    name: logins

  datasource:
    url: jdbc:postgresql://localhost:5432/login-db
    # url: jdbc:postgresql://postgres-db:5432/userdb
    username: postgres
    password: ${DB_PASSWORD:jyoti}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect